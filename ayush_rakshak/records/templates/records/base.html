{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clinical Dashboard</title>

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Font Awesome (Icons ke liye) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f3f4f6;
        }

        /* Light grey background */
        .bg-emerald {
            background-color: #047857 !important;
        }

        /* Clinic/Medical Green */
        .text-emerald {
            color: #047857 !important;
        }
    </style>
</head>

<body>

    <!-- Modern Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-emerald shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fa-solid fa-staff-snake"></i> Clinic Dashboard
            </a>
            <div class="ms-auto d-flex gap-3 align-items-center">
                <span class="text-white"><i class="fa-solid fa-user-doctor"></i> Clinic Portal</span>
                <!-- Agar logout URL banaya hai toh ye chalega -->
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i>
                    Logout</a>
            </div>
        </div>
    </nav>

    <!-- Asli Content Yahan Aayega -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
